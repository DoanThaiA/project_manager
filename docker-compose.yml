# Database dùng chung server PostgreSQL của ai_carbon_analyst, database riêng `project_manager`,
# user riêng `pm_user`. Khởi tạo lần đầu: scripts/init_db.sh. Cấu hình trong .env (xem .env.example).
services:
  api:
    build: ./backend
    container_name: project_manager_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://pm_user:${PM_DB_PASSWORD:?Thiếu PM_DB_PASSWORD trong .env}@${PM_DB_HOST:-carbon_analyst_db}:5432/project_manager
      SECRET_KEY: ${SECRET_KEY:?Thiếu SECRET_KEY trong .env}
    ports:
      - "${PM_BIND_ADDR:-0.0.0.0}:${PM_API_PORT:-8000}:8000"
    networks:
      - default
      - shared-db

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    container_name: project_manager_web
    restart: unless-stopped
    ports:
      - "${PM_BIND_ADDR:-0.0.0.0}:${PM_WEB_PORT:-3000}:3000"
    depends_on:
      - api

networks:
  # Mạng docker-compose của ai_carbon_analyst (chứa container PostgreSQL)
  shared-db:
    external: true
    name: ${PM_DB_NETWORK:-ai_carbon_analyst_default}

# Database dùng chung server PostgreSQL của ai_carbon_analyst, database riêng `project_manager`,
# user riêng `pm_user`. Khởi tạo lần đầu: scripts/init_db.sh; API tự chạy alembic upgrade head khi khởi động. Cấu hình trong .env (xem .env.example).
services:
  api:
    build: ./backend
    container_name: project_manager_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://pm_user:${PM_DB_PASSWORD:?Thiếu PM_DB_PASSWORD trong .env}@${PM_DB_HOST:-carbon_analyst_db}:5432/project_manager
      SECRET_KEY: ${SECRET_KEY:?Thiếu SECRET_KEY trong .env}
      # Cloudflare Images lưu ảnh đính kèm công việc (xem docs/DEPLOY.md)
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_IMAGES_TOKEN: ${CF_IMAGES_TOKEN:-}
      CF_IMAGES_ACCOUNT_HASH: ${CF_IMAGES_ACCOUNT_HASH:-}
      CF_IMAGES_SIGNING_KEY: ${CF_IMAGES_SIGNING_KEY:-}
      # Cloudflare R2 lưu file đính kèm (tài liệu, PDF, Excel...) (xem docs/DEPLOY.md mục 11)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-project-manager}
      FILE_OFFICE_PREVIEW: ${FILE_OFFICE_PREVIEW:-true}
      # OCR.space đọc ảnh danh thiếp khi thêm người liên hệ
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      # Thông báo Telegram: bot nhận lệnh bằng long polling nên chỉ cần gọi ra được api.telegram.org
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      # Domain HTTPS để lệnh issue-mcp-url in đúng URL connector (xem docs/MCP.md)
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-https://dev.mcv.network}
    ports:
      - "${PM_BIND_ADDR:-0.0.0.0}:${PM_API_PORT:-8000}:8000"
    networks:
      - default
      - shared-db

  # MCP server cho ban lãnh đạo (connector URL, xem docs/MCP.md). Chỉ lắng nghe 127.0.0.1: nginx chuyển /mcp/ tới đây
  mcp:
    build: ./backend
    container_name: project_manager_mcp
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server"]
    environment:
      MCP_API_URL: http://api:8000/api/v1
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-https://dev.mcv.network}
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-120}
    ports:
      - "127.0.0.1:${PM_MCP_PORT:-8100}:8001"
    depends_on:
      - api

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    container_name: project_manager_web
    restart: unless-stopped
    ports:
      - "${PM_BIND_ADDR:-0.0.0.0}:${PM_WEB_PORT:-3000}:3000"
    depends_on:
      - api

networks:
  # Mạng docker-compose của ai_carbon_analyst (chứa container PostgreSQL)
  shared-db:
    external: true
    name: ${PM_DB_NETWORK:-ai_carbon_analyst_default}

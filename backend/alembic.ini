# Alembic — migration database. Chạy trong thư mục backend/:
#   uv run alembic upgrade head                      # áp mọi migration
#   uv run alembic revision -m "mô tả"               # migration viết tay
#   uv run alembic revision --autogenerate -m "..."  # sinh từ model (luôn đọc lại trước khi chạy)
# DATABASE_URL lấy từ app.core.config (biến môi trường / backend/.env), không ghi ở đây.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
